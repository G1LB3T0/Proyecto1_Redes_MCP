# Dedicated virtual host; existing sites and upstreams are independent.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.canchonfc.online;
    client_max_body_size 64k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pharmacy-mcp-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
