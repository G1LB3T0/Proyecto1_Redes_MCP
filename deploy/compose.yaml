name: pharmacy-mcp
services:
  pharmacy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: pharmacy-mcp:1.0
    env_file:
      - runtime.env
    environment:
      MCP_ALLOWED_ORIGINS: https://mcp.canchonfc.online
    ports:
      - "127.0.0.1:8091:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
